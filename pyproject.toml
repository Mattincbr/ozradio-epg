[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "radio-epg"
version = "0.1.0"
description = "Generate XMLTV EPG files for radio stations in IPTV M3U8 playlists"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "click>=8.1",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=4.9",
    "pyyaml>=6.0",
    "pytz>=2024.1",
    "flask>=3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "responses>=0.25",
]

[project.scripts]
radio-epg = "radio_epg.cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["radio_epg*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
