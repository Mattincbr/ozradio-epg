_meta:
  id: abc-rn
  display_name: "ABC Radio National"
  description: "Australia's flagship public radio network — news, arts, science and ideas"
  country: AU
  notes: "Slot positions are stable. Some afternoon programs rotate by weekday. Scrape https://www.abc.net.au/listen/radionational/guide for up-to-date programme images."
  match:
    - "radio national"
    - "abc rn"
    - "abc-rn"
    - "rnational"
    - "rn national"

channel:
