  display_name: "4ZZZ Brisbane (102.1 FM)"
  description: "4ZZZ — Brisbane's independent community radio station. Alternative music, local arts, ethnic and community programming since 1975."
  country: AU
  notes: "4ZZZ runs a volunteer-based rotating programme grid. Individual show times shift regularly. Verify current schedule at https://www.4zzz.org.au/programs. This template reflects the approximate daypart structure."
  match:
    - "4zzz"
    - "4zzzfm"
    - "4zzz fm"
    - "102.1 brisbane"
    - "zed fm brisbane"
    - "community radio brisbane"

channel:
