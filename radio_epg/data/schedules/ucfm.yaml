_meta:
  id: ucfm
  display_name: "UC FM (University of Canberra)"
  description: "UC FM — University of Canberra's community radio station, student-run with music, arts and community programming."
  country: AU
  notes: "UC FM is the University of Canberra's campus and community radio. Verify current frequency/stream and schedule at https://www.ucfm.com.au — volunteer-run grids shift regularly."
  match:
    - "ucfm"
    - "uc fm"
    - "university of canberra fm"
    - "university canberra radio"
    - "uc radio"
    - "ucfm canberra"

channel:
  id: ucfm
  name: "UC FM"
  timezone: "Australia/Sydney"
  website: "https://www.ucfm.com.au"

