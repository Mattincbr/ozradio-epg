_meta:
  id: ucfm
  display_name: "UCfm Community Radio"
  description: "UCfm — Australian community radio station."
  country: AU
  notes: |
    PLEASE VERIFY: There are multiple Australian stations that use the UCfm name or call sign.
    Common candidates:
      - 100.3 UCfm (Upper Coomera / Gold Coast, QLD)
      - University of Canberra community broadcasting
    Update the channel.id, channel.name, channel.timezone and channel.website fields
    to match your specific station, and scrape or paste the correct schedule.
  match:
    - "ucfm"
    - "uc fm"
    - "ucfm community"
    - "upper coomera fm"
    - "100.3 ucfm"

channel:
  id: ucfm
  name: "UCfm"
  timezone: "Australia/Brisbane"
  website: "https://www.ucfm.com.au"

schedule:
