_meta:
  id: rnz-national
  display_name: "RNZ National"
  description: "Radio New Zealand National — news, current affairs, arts and culture."
  country: NZ
  notes: "RNZ National is New Zealand's main public radio network. Schedule is NZST/NZDT (Pacific/Auckland)."
  match:
    - "rnz national"
    - "radio new zealand"
    - "rnz"
    - "radio nz"
    - "nz national radio"

channel:
  id: rnz-national
  name: "RNZ National"
  timezone: "Pacific/Auckland"
  website: "https://www.rnz.co.nz/national"

schedule:
  weekdays:
    - start: "00:00"
      title: "Overnight"
      description: "Overnight programming and BBC World Service."
    - start: "06:00"
      title: "Morning Report"
      description: "New Zealand's flagship morning news and current affairs programme."
      url: "https://www.rnz.co.nz/national/programmes/morningreport"
    - start: "09:00"
      title: "Nine to Noon"
      description: "Wide-ranging morning programme covering culture, science and current affairs."
      url: "https://www.rnz.co.nz/national/programmes/ninetonoon"
    - start: "12:00"
      title: "Midday Report"
      description: "News at midday."
      url: "https://www.rnz.co.nz/national/programmes/middayreport"
    - start: "12:15"
      title: "Afternoons"
      description: "Conversation, culture and features through the afternoon with Jesse Mulligan."
      url: "https://www.rnz.co.nz/national/programmes/afternoons"
